<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuvio · Главный экран</title><style>*{box-sizing:border-box}body{background:radial-gradient(ellipse at 22% 0,#354773,transparent 60%),linear-gradient(130deg,#171e35,#181421);min-height:100vh;margin:0;padding:9vh 7vw;color:#fff;font:500 clamp(16px,2vw,30px) "Segoe UI",sans-serif}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:1.9em;font-weight:600}main{margin-top:12vh;display:grid;grid-template-columns:repeat(3,1fr);gap:2vw}button{border:0;border-radius:16px;padding:5vh 1vw;color:white;font:600 1em "Segoe UI",sans-serif;background:linear-gradient(150deg,var(--c),#22263b);transition:transform .15s}button:focus{outline:3px solid white;outline-offset:4px;transform:scale(1.03)}footer{margin-top:6vh;color:#d5dbea;font-size:.65em}</style><header><h1>Главный экран</h1><time></time></header><main></main><footer>Предпросмотр · Стрелки перемещают выделение</footer><script>
const apps=[['YouTube','#b52626'],['TV Bro','#165cab'],['Happ','#337164'],['Кинопоиск','#b64913'],['VK Видео','#165cab'],['Файлы','#624478'],['Настройки','#53617a']];
for(const [name,color] of apps){const b=document.createElement('button');b.textContent=name;b.style.setProperty('--c',color);document.querySelector('main').append(b)}
const buttons=[...document.querySelectorAll('button')];buttons[0].focus();document.addEventListener('keydown',e=>{const step={ArrowLeft:-1,ArrowRight:1,ArrowUp:-3,ArrowDown:3}[e.key];if(step){e.preventDefault();buttons[Math.max(0,Math.min(buttons.length-1,buttons.indexOf(document.activeElement)+step))].focus()}});document.querySelector('time').textContent=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
</script></html>
